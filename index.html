<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myggan House — Spelhallen</title>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sea-deep: #262b33;
    --sea-mid: #454e5c;
    --foam: #dfe2e6;
    --wood: #6b4226;
    --wood-dark: #4a2d19;
    --falu-red: #8a3428;
    --gold: #b8903f;
    --gold-bright: #e0b563;
    --ink: #221a12;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; min-height:100vh;
    font-family:'Inter', sans-serif;
    color: var(--foam);
    background:
      radial-gradient(ellipse at 50% -10%, #1c6d81 0%, transparent 55%),
      linear-gradient(180deg, var(--sea-deep) 0%, #12181d 60%, #0a0d10 100%);
  }
  .wrap{ max-width: 980px; margin:0 auto; padding: 28px 18px 60px; }

  header{ text-align:center; margin-bottom: 20px; }
  .brand{
    font-family:'Rye', serif;
    font-size: clamp(34px, 8vw, 56px);
    color: var(--gold-bright);
    text-shadow: 0 3px 0 var(--falu-red), 0 8px 18px rgba(0,0,0,.5);
    letter-spacing: 1px;
    margin: 6px 0 2px;
  }
  .brand-sub{
    font-size: 14px;
    color: #bfe3e8;
    font-style: italic;
  }

  .search-row{
    display:flex;
    gap: 10px;
    margin: 22px 0 14px;
    flex-wrap: wrap;
  }
  .search-input{
    flex: 1 1 240px;
    padding: 12px 16px;
    border-radius: 12px;
    border: 2px solid rgba(212,167,61,.4);
    background: rgba(255,255,255,.06);
    color: var(--foam);
    font-size: 15px;
    outline: none;
  }
  .search-input::placeholder{ color: #93a0aa; }
  .search-input:focus{ border-color: var(--gold-bright); }

  .filter-row{
    display:flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .filter-pill{
    padding: 7px 16px;
    border-radius: 20px;
    border: 2px solid rgba(255,180,80,.4);
    background: rgba(255,255,255,.06);
    color: var(--foam);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s ease;
  }
  .filter-pill.active{
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    border-color: var(--gold-bright);
    color: var(--ink);
  }

  .games-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 18px;
  }

  .game-card{
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: linear-gradient(160deg, var(--wood), var(--wood-dark));
    box-shadow: 0 8px 20px rgba(0,0,0,.4), inset 0 0 0 2px rgba(212,167,61,.2);
    text-decoration: none;
    color: var(--foam);
    display: block;
    transition: transform .15s ease, box-shadow .15s ease;
    cursor: pointer;
  }
  .game-card:hover{
    transform: translateY(-4px);
    box-shadow: 0 14px 28px rgba(0,0,0,.5), inset 0 0 0 2px rgba(212,167,61,.4);
  }
  .game-thumb{
    height: 140px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 56px;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,.12), transparent 55%),
      linear-gradient(160deg, #1c6d81, var(--sea-deep));
  }
  .game-info{
    padding: 12px 14px 16px;
  }
  .game-title{
    font-family:'Rye', serif;
    font-size: 20px;
    color: var(--gold-bright);
    margin: 0 0 4px;
  }
  .game-tags{
    display:flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .tag{
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(255,255,255,.1);
    color: #cfe;
    letter-spacing: .3px;
  }
  .tag.new{ background: linear-gradient(180deg, var(--falu-red), #5c1613); color:#fff; }

  .game-card.locked{
    cursor: default;
    opacity: .55;
    filter: grayscale(.4);
  }
  .game-card.locked:hover{ transform: none; box-shadow: 0 8px 20px rgba(0,0,0,.4); }
  .lock-badge{
    position:absolute;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,.55);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 600;
  }

  .no-results{
    text-align:center;
    padding: 40px 10px;
    color: #93a0aa;
    display:none;
  }
  .no-results.visible{ display:block; }

  footer{
    text-align:center;
    font-size: 12px;
    color: #7fa6ad;
    margin-top: 40px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">🦟 MYGGAN HOUSE</div>
    <div class="brand-sub">Hemmagjorda skoj-slots från skärgården — fler spel på gång, håll ut!</div>
  </header>

  <div class="search-row">
    <input type="text" class="search-input" id="searchInput" placeholder="Sök efter ett spel...">
  </div>

  <div class="filter-row" id="filterRow">
    <button class="filter-pill active" data-filter="alla">Alla</button>
    <button class="filter-pill" data-filter="megaways">Megaways</button>
    <button class="filter-pill" data-filter="bonus">Bonusspel</button>
    <button class="filter-pill" data-filter="nya">Nya</button>
    <button class="filter-pill" data-filter="kommer">Kommer snart</button>
  </div>

  <div class="games-grid" id="gamesGrid"></div>

  <div class="no-results" id="noResults">Inga spel matchade din sökning. 🎣</div>

  <footer>Fiktiva lekspel utan riktiga pengar. Myggan House &copy; 2026.</footer>
</div>

  const GAMES = [
    {
      id: 'torsk',
      title: 'TORSK',
      emoji: '🐟',
      thumb: THUMBS.torsk,
      tags: ['megaways', 'bonus', 'nya'],
      tagLabels: [['MEGAWAYS',''], ['BONUS',''], ['NYTT','new']],
      href: 'games/torsk/index.html',
      locked: false
    },
    {
      id: 'kommer1',
      title: '???',
      emoji: '🔒',
      tags: ['kommer'],
      tagLabels: [['KOMMER SNART','']],
      href: null,
      locked: true
    },
    {
      id: 'kommer2',
      title: '???',
      emoji: '🔒',
      tags: ['kommer'],
      tagLabels: [['KOMMER SNART','']],
      href: null,
      locked: true
    },
    {
      id: 'kommer3',
      title: '???',
      emoji: '🔒',
      tags: ['kommer'],
      tagLabels: [['KOMMER SNART','']],
      href: null,
      locked: true
    }
  ];

  const gamesGrid = document.getElementById('gamesGrid');
  const searchInput = document.getElementById('searchInput');
  const filterRow = document.getElementById('filterRow');
  const noResults = document.getElementById('noResults');

  let activeFilter = 'alla';
  let searchTerm = '';

  function buildCard(game){
    const el = document.createElement(game.locked ? 'div' : 'a');
    el.className = 'game-card' + (game.locked ? ' locked' : '');
    if(!game.locked) el.href = game.href;

    let tagsHtml = game.tagLabels.map(([label, cls]) =>
      `<span class="tag ${cls}">${label}</span>`
    ).join('');

    const thumbStyle = game.thumb
      ? `style="background-image: linear-gradient(180deg, rgba(10,14,18,.15), rgba(6,9,11,.55)), url('${game.thumb}'); background-size: cover; background-position: center;"`
      : '';
    const thumbContent = game.thumb ? '' : game.emoji;

    el.innerHTML = `
      ${game.locked ? '<div class="lock-badge">🔒 Snart</div>' : ''}
      <div class="game-thumb" ${thumbStyle}>${thumbContent}</div>
      <div class="game-info">
        <div class="game-title">${game.title}</div>
        <div class="game-tags">${tagsHtml}</div>
      </div>
    `;
    return el;
  }

  function render(){
    gamesGrid.innerHTML = '';
    const term = searchTerm.trim().toLowerCase();
    let visibleCount = 0;

    GAMES.forEach(game => {
      const matchesFilter = activeFilter === 'alla' || game.tags.includes(activeFilter);
      const matchesSearch = !term || game.title.toLowerCase().includes(term);
      if(matchesFilter && matchesSearch){
        gamesGrid.appendChild(buildCard(game));
        visibleCount++;
      }
    });

    noResults.classList.toggle('visible', visibleCount === 0);
  }

  filterRow.querySelectorAll('.filter-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      filterRow.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      activeFilter = pill.dataset.filter;
      render();
    });
  });

  searchInput.addEventListener('input', () => {
    searchTerm = searchInput.value;
    render();
  });

  render();
})();
</script>
